# The simulated company that Incident monitors.
#   gateway -> order -> inventory
#                    -> payment -> postgres
#
#   loadgen sends steady traffic to gateway.
#
# Ports are bound to 127.0.0.1 so they are only reachable from this machine.

x-service: &service
  build: ./services
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  gateway:
    <<: *service
    environment:
      INCIDENT_METRIC_NAMESPACE: ${INCIDENT_METRIC_NAMESPACE:-Incident}
      ORDER_URL: http://order:8000
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports: ["127.0.0.1:8090:8000"]
    depends_on:
      order: {condition: service_healthy}

  order:
    <<: *service
    command: ["uvicorn", "order.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      INCIDENT_METRIC_NAMESPACE: ${INCIDENT_METRIC_NAMESPACE:-Incident}
      INVENTORY_URL: http://inventory:8000
      PAYMENT_URL: http://payment:8000
    ports: ["127.0.0.1:8091:8000"]
    depends_on:
      inventory: {condition: service_healthy}
      payment: {condition: service_healthy}

  payment:
    <<: *service
    command: ["uvicorn", "payment.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      INCIDENT_METRIC_NAMESPACE: ${INCIDENT_METRIC_NAMESPACE:-Incident}
      DATABASE_URL: postgresql://incident:incident@postgres:5432/payments
      POOL_SIZE: "5"
    ports: ["127.0.0.1:8092:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  inventory:
    <<: *service
    environment:
      INCIDENT_METRIC_NAMESPACE: ${INCIDENT_METRIC_NAMESPACE:-Incident}
    command: ["uvicorn", "inventory.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports: ["127.0.0.1:8093:8000"]

  loadgen:
    build: ./services
    command: ["python", "-m", "loadgen.main"]
    environment:
      GATEWAY_URL: http://gateway:8000
      RATE: "5"
    depends_on:
      gateway: {condition: service_healthy}

  # Incident itself. Deliberately no depends_on: a monitor must keep running when the
  # services it watches are down.
  backend:
    build: ./backend
    environment:
      GATEWAY_URL: http://gateway:8000
      ORDER_URL: http://order:8000
      PAYMENT_URL: http://payment:8000
      INVENTORY_URL: http://inventory:8000
      AWS_REGION: ${AWS_REGION:-us-east-2}
      INCIDENT_AWS_PROFILE: ${AWS_PROFILE:-}  # from .env; empty means default credentials
      INCIDENT_QUEUE_URL: ${INCIDENT_QUEUE_URL:-}
      INCIDENT_TABLE: ${INCIDENT_TABLE:-incident-store}
      INCIDENT_LOG_PREFIX: ${INCIDENT_LOG_PREFIX:-/incident}
      INCIDENT_METRIC_NAMESPACE: ${INCIDENT_METRIC_NAMESPACE:-Incident}
      INCIDENT_ALARM_PREFIX: ${INCIDENT_ALARM_PREFIX:-incident}
      INCIDENT_EVIDENCE_BUCKET: ${INCIDENT_EVIDENCE_BUCKET:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-openai.gpt-oss-20b-1:0}
    volumes:
      # Reuse your local `aws login` session. Writable so the SDK can refresh it.
      - ~/.aws:/home/appuser/.aws
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # The dashboard: http://localhost:3000 (nginx serves the React build and proxies /api).
  # Only ever bound to 127.0.0.1: the API behind it has no authentication yet, so on EC2
  # it is reached through an SSH tunnel (see docs/DEPLOY.md), never a public port.
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      # Local simulation only; never reuse these credentials anywhere real.
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
