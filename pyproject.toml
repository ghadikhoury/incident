[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["services", "backend", "."]
testpaths = ["services/tests", "backend/tests", "infra/tests"]
# importlib mode lets services/tests and backend/tests each have their own conftest.py
addopts = "--import-mode=importlib"
