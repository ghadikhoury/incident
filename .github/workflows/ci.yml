name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Test
        # Exit code 5 means "no tests collected", which is fine until code exists.
        run: pytest || [ $? -eq 5 ]
