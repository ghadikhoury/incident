name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip install -r infra/requirements.txt
      - name: Build Lambda asset for CDK checks
        run: python -m infra.build
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Lint deploy scripts
        run: shellcheck deploy/*.sh
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type-check and build
        run: npm run build

  compose-smoke:
    # Boots the whole system and runs the integration tests against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EC2 compose layer is valid
        run: docker compose -f docker-compose.yml -f docker-compose.ec2.yml config --quiet
      - name: Start services
        run: docker compose up -d --build --wait
      - name: Backend sees every service as healthy
        run: |
          for i in $(seq 1 10); do
            if curl -fsS localhost:8000/api/services | python3 -c "import json, sys; sys.exit(any(s['status'] != 'healthy' for s in json.load(sys.stdin)))"; then
              exit 0
            fi
            sleep 2
          done
          curl -sS localhost:8000/api/services
          exit 1
      - name: Dashboard is served and proxies the API
        run: |
          curl -fsS localhost:3000/ | grep -q '<title>Incident</title>'
          curl -fsS localhost:3000/api/health
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integration tests against the running stack
        run: |
          pip install pytest==9.1.1 httpx==0.28.1
          pytest integration -v
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
